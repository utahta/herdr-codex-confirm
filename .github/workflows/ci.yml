name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: for script in install.sh scripts/*.sh; do sh -n "$script"; done
      - run: sh install.sh
      - run: ./herdr-codex-confirm --version
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - name: Check tag validation
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' herdr-plugin.toml)
          sh scripts/check-tag-version.sh "v$version"
          if sh scripts/check-tag-version.sh v999.999.999; then
            echo 'Accepted a tag that does not match the manifest.' >&2
            exit 1
          fi
      - run: sh scripts/release.sh
      - run: sh scripts/install_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/signing-key.pub
